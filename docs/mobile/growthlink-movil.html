<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c63ff">
<title>Growth Link · versión móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#6c63ff; --accent-600:#574dde; --accent-50:#f1f0ff; --accent-100:#e4e2ff;
  --bg:#ffffff; --fg:#101828; --s1:#ffffff; --s2:#f8f9fb; --s3:#f0f2f5;
  --border:#e4e7ec; --border-strong:#d0d5dd; --muted:#667085; --muted-2:#98a2b3;
  --ok:#2e9563; --ok-bg:#ecf9f2; --warn:#b7791f; --warn-bg:#fbf2e3; --err:#c1484f; --err-bg:#fceeee; --info:#3573c9; --info-bg:#eaf1fb;
  --wa:#25a366; --ig:#c13584;
  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:20px; --r-xl:28px;
  --e-sm:0 4px 16px rgba(16,24,40,.06); --e-lg:0 20px 48px rgba(16,24,40,.14);
  --ease:cubic-bezier(.16,1,.3,1);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{
  --bg:#0b0f19; --fg:#f0f2f5; --s1:#0b0f19; --s2:#101828; --s3:#1d2939;
  --border:#1d2939; --border-strong:#344054; --muted:#98a2b3; --muted-2:#667085;
  --accent-50:#2b2870; --accent-100:#363089;
  --ok-bg:#12301f; --warn-bg:#33270f; --err-bg:#3a1a1d; --info-bg:#132a47;
  --e-sm:0 4px 16px rgba(0,0,0,.34); --e-lg:0 20px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;background:#e9ebf2;color:var(--fg);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
[data-theme="dark"] body{background:#05070d}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:var(--fg)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Marco: en PC se ve como un teléfono; en el celular ocupa toda la pantalla */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding:32px}
.device{position:relative;width:390px;height:844px;background:var(--bg);border-radius:48px;overflow:hidden;overflow:clip;box-shadow:0 0 0 10px #1b1f2a,0 0 0 11px #3a3f4d,0 40px 80px rgba(16,24,40,.35);isolation:isolate}
.device::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:60}
.device{--safe-t:47px;--safe-b:20px}
.side{max-width:300px;color:#344054}
[data-theme="dark"] .side{color:#d0d5dd}
.side h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-bottom:12px}
.side p{color:inherit;opacity:.75;margin-bottom:20px}
.side .row{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{padding:8px 14px;border-radius:999px;background:#fff;border:1px solid #d0d5dd;font-weight:500;font-size:14px}
[data-theme="dark"] .chipbtn{background:#101828;border-color:#344054}
@media (max-width:520px){
  body{background:var(--bg)}
  .stage{padding:0;display:block}
  .side{display:none}
  .device{width:100%;height:100dvh;border-radius:0;box-shadow:none;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
  .device::before{display:none}
}

/* Estructura de la app */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.topbar{padding:calc(var(--safe-t) + 8px) 16px 10px;display:flex;align-items:center;gap:8px;background:var(--bg);border-bottom:1px solid transparent;z-index:5}
.topbar.line{border-bottom-color:var(--border)}
.topbar h2{font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h2.sm{font-size:17px;font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--fg)}
.iconbtn:active{background:var(--s3)}
.dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--err);box-shadow:0 0 0 2px var(--bg)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:4px 16px calc(96px + var(--safe-b))}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;padding:6px 6px calc(6px + var(--safe-b));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:52px;font-size:11px;font-weight:500;color:var(--muted);position:relative}
.tab.on{color:var(--accent)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px)}
.fab{position:absolute;right:16px;bottom:calc(84px + var(--safe-b));width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(108,99,255,.4);z-index:15}
.fab svg.i{width:24px;height:24px}
.fab:active{transform:scale(.96)}

/* Piezas comunes */
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--s3);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.err{background:var(--err-bg);color:var(--err)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.ai{background:var(--accent-50);color:var(--accent)}
[data-theme="dark"] .pill.ai{color:#ada5ff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);font-size:14px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.section-h h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.section-h button{font-size:14px;color:var(--accent);font-weight:500;min-height:44px;padding:0 4px}
.list{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--border)}
.row:active{background:var(--s2)}
.row .body{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--muted);flex:none}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;position:relative;color:#fff}
.av .ch{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 2px var(--bg);display:grid;place-items:center}
.av .ch svg.i{width:10px;height:10px;stroke:#fff;stroke-width:2.5}
.ico-tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-50);color:var(--accent);flex:none}
[data-theme="dark"] .ico-tile{color:#ada5ff}
.btn{height:48px;border-radius:14px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-600)}
.btn.ghost{background:var(--s3)}
.btn.block{width:100%}
.empty{color:var(--muted);text-align:center;padding:40px 16px}

/* Dashboard */
.hello{margin:6px 0 16px}
.hello p{color:var(--muted)}
.focus{border-radius:var(--r-xl);padding:20px;background:var(--accent);color:#fff;position:relative;overflow:hidden}
.focus .big{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1}
.focus .lbl{opacity:.85;margin-top:6px;max-width:220px}
.focus .act{margin-top:16px;display:flex;gap:8px}
.focus .act button{height:40px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.18);font-weight:600;font-size:14px}
.focus .act button.w{background:#fff;color:var(--accent)}
.focus svg.ring{position:absolute;right:-30px;top:-30px;width:170px;height:170px;opacity:.18}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi{border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;background:var(--s1)}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .d{font-size:12px;font-weight:600;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--err)}
.chart{border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;background:var(--s1)}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.bars span{width:100%;border-radius:8px 8px 4px 4px;background:var(--accent-100)}
.bars span.on{background:var(--accent)}
.legend{display:flex;justify-content:space-between;align-items:baseline}
.legend b{font-size:20px}

/* Inbox */
.searchbox{display:flex;align-items:center;gap:8px;height:44px;border-radius:12px;background:var(--s3);padding:0 12px;color:var(--muted);margin-bottom:12px}
.searchbox input{flex:1;border:0;background:none;outline:none;min-width:0}
.conv .t{display:flex;gap:6px;align-items:center}
.unread .t{font-weight:700}.unread .s{color:var(--fg)}
.chat{flex:1;overflow-y:auto;padding:14px 12px 12px;display:flex;flex-direction:column;gap:6px;background:var(--s2)}
.daysep{align-self:center;font-size:12px;color:var(--muted);background:var(--s1);border:1px solid var(--border);padding:3px 10px;border-radius:999px;margin:8px 0}
.msg{max-width:80%;padding:9px 12px;border-radius:18px;font-size:15px;line-height:1.35;position:relative}
.msg small{display:block;font-size:11px;margin-top:3px;opacity:.6;text-align:right}
.msg.in{align-self:flex-start;background:var(--s1);border:1px solid var(--border);border-bottom-left-radius:6px}
.msg.out{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-end;background:var(--accent-50);color:var(--fg);border-bottom-right-radius:6px;border:1px solid var(--accent-100)}
.msg.ai .who{font-size:11px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:4px;margin-bottom:2px}
[data-theme="dark"] .msg.ai .who{color:#ada5ff}
.handoff{margin:0 12px 8px;padding:10px 12px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:13px;display:flex;gap:10px;align-items:center}
.handoff b{color:var(--fg)}
.handoff button{margin-left:auto;height:36px;padding:0 12px;border-radius:10px;background:var(--fg);color:var(--bg);font-weight:600;font-size:13px;flex:none}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(8px + var(--safe-b));border-top:1px solid var(--border);background:var(--bg)}
.composer textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--s2);border-radius:22px;padding:11px 14px;min-height:44px;max-height:120px;outline:none;line-height:1.3}
.sendbtn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;background:var(--bg);scrollbar-width:none}
.quick button{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--accent-100);color:var(--accent);font-size:13px;font-weight:500;display:flex;align-items:center;gap:4px}
[data-theme="dark"] .quick button{color:#ada5ff}

/* CRM */
.stagebar{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;border-bottom:1px solid var(--border)}
.stagebar::-webkit-scrollbar{display:none}
.stg{flex:none;height:36px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.stg i{font-style:normal;font-size:12px;background:var(--s3);border-radius:6px;padding:1px 6px}
.stg.on{background:var(--accent-50);color:var(--accent)}
[data-theme="dark"] .stg.on{color:#ada5ff}
.cols{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.cols::-webkit-scrollbar{display:none}
.col{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:12px 16px calc(96px + var(--safe-b))}
.colhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}
.colhead b{color:var(--fg)}
.card{border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;background:var(--s1);margin-bottom:10px;width:100%;text-align:left;display:block}
.card:active{background:var(--s2)}
.card .top{display:flex;gap:10px;align-items:center}
.card .nm{font-weight:600}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.movebtn{height:36px;padding:0 10px;border-radius:10px;background:var(--s3);color:var(--fg);font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.dots{display:flex;justify-content:center;gap:6px;padding:8px 0 0}
.dots span{width:6px;height:6px;border-radius:3px;background:var(--border-strong);transition:width .2s var(--ease)}
.dots span.on{width:18px;background:var(--accent)}

/* Ficha de lead */
.hero{text-align:center;padding:8px 0 18px}
.hero .av{width:76px;height:76px;font-size:24px;margin:0 auto 10px}
.hero h3{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hero p{color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-radius:16px;background:var(--s3);font-size:12px;font-weight:500}
.acts button.wa{background:var(--ok-bg);color:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:14px;min-height:52px;align-items:center}
.kv+.kv{border-top:1px solid var(--border)}
.kv span{color:var(--muted)}
.kv b{font-weight:500;text-align:right}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border)}
.ev{position:relative;padding-bottom:16px}
.ev::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.ev .s{font-size:13px;color:var(--muted)}

/* Agenda */
.week{display:flex;gap:6px;margin:0 -16px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none}
.week::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;height:68px;border-radius:16px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);position:relative}
.day b{font-size:19px;color:var(--fg)}
.day.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.day.on b{color:var(--bg)}
.day .mk{position:absolute;bottom:7px;width:4px;height:4px;border-radius:2px;background:var(--accent)}
.slot{display:flex;gap:12px;margin-bottom:10px}
.slot .hr{width:46px;font-size:13px;color:var(--muted);padding-top:14px;text-align:right;flex:none}
.appt{flex:1;border-radius:16px;padding:12px 14px;background:var(--s1);border:1px solid var(--border);border-left:4px solid var(--accent);text-align:left}
.appt .t{font-weight:600}
.appt .s{font-size:13px;color:var(--muted)}
.appt.done{opacity:.55}

/* Tareas */
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;min-height:60px}
.task+.task{border-top:1px solid var(--border)}
.cbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--border-strong);display:grid;place-items:center;flex:none;margin-top:1px}
.cbox svg.i{width:16px;height:16px;stroke:#fff;stroke-width:3;opacity:0}
.task.done .cbox{background:var(--ok);border-color:var(--ok)}
.task.done .cbox svg.i{opacity:1}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .t{font-weight:500}
.task .s{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* Más */
.profile{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--r-lg);margin:6px 0 4px}
.profile .av{background:var(--accent)}
.grp{font-size:13px;color:var(--muted);font-weight:500;margin:20px 4px 8px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mod{border:1px solid var(--border);border-radius:16px;padding:12px 10px;min-height:92px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;background:var(--s1)}
.mod:active{background:var(--s2)}
.mod span{font-size:13px;font-weight:500;line-height:1.2}
.mod .ico-tile{width:34px;height:34px;border-radius:10px}
.mod .ico-tile svg.i{width:18px;height:18px}
.mod .ia{font-size:10px;font-weight:700;color:var(--ok);background:var(--ok-bg);padding:1px 5px;border-radius:5px;margin-left:4px;vertical-align:1px}
.switch{width:50px;height:30px;border-radius:15px;background:var(--border-strong);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}

/* Módulo genérico */
.stats{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 14px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none;min-width:120px;border:1px solid var(--border);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--s2);border:1px dashed var(--border-strong);border-radius:14px;padding:12px;margin-top:16px}

/* Login */
.login{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 40px) 24px calc(24px + var(--safe-b));background:var(--bg);z-index:40}
.logo{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;font-weight:700;font-size:21px;display:grid;place-items:center;letter-spacing:-.02em}
.login h1{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:28px 0 6px;line-height:1.1}
.login > p{color:var(--muted);margin-bottom:28px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.field input{width:100%;height:50px;border-radius:14px;border:1px solid var(--border-strong);background:var(--s1);padding:0 14px;outline:none}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-50)}
.login .forgot{align-self:flex-end;color:var(--accent);font-size:14px;font-weight:500;min-height:44px;margin:-6px 0 8px}
.login .spacer{flex:1}
.login .foot{text-align:center;font-size:14px;color:var(--muted);margin-top:14px}
.login .foot b{color:var(--accent)}

/* Bottom sheet */
.scrim{position:absolute;inset:0;background:rgba(16,24,40,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 16px calc(16px + var(--safe-b));transform:translateY(105%);transition:transform .32s var(--ease);z-index:51;max-height:80%;overflow-y:auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border-strong);margin:0 auto 12px}
.sheet h4{font-size:18px;font-weight:600;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px;min-height:56px;border-radius:14px;text-align:left;font-weight:500}
.opt:active{background:var(--s3)}
.opt.cur{background:var(--accent-50)}
.opt .end{margin-left:auto;color:var(--accent)}
.toast{position:absolute;left:16px;right:16px;bottom:calc(92px + var(--safe-b));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center;transform:translateY(20px);opacity:0;transition:all .3s var(--ease);z-index:70;pointer-events:none}
.toast.show{transform:none;opacity:1}
.screen-in{animation:in .28s var(--ease)}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Render ---------- */
function render(){
  if(!S.logged){app.innerHTML=Login();return}
  const top=S.stack[S.stack.length-1];
  let html='',fab=false,tabs=true;
  if(top){
    if(top.screen==='chat'){html=Chat(top.data);tabs=false}
    else if(top.screen==='lead'){html=Lead(top.data)}
    else if(top.screen==='mod'){html=Module(top.data);if(!html)return;fab=top.data==='tasks'}
  }else{
    html={dashboard:Dashboard,inbox:Inbox,crm:CRM,agenda:Agenda,mas:Mas}[S.tab]();
    fab=['dashboard','crm','agenda'].includes(S.tab);
  }
  app.innerHTML=`<div class="app screen-in" style="position:absolute;inset:0;display:flex;flex-direction:column">${html}${fab?`<button class="fab" data-action="new" aria-label="Crear">${I('plus')}</button>`:''}${tabs?tabbar():''}</div>`;
  if(top&&top.screen==='chat'){const c=document.getElementById('chat');c.scrollTop=c.scrollHeight;autoGrow()}
  if(!top&&S.tab==='crm')setupCols();
}
function setupCols(){
  const cols=document.getElementById('cols'),bar=document.getElementById('stagebar');
  cols.scrollLeft=S.stage*cols.clientWidth;
  let t;cols.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{const i=Math.round(cols.scrollLeft/cols.clientWidth);if(i!==S.stage){S.stage=i;bar.querySelectorAll('.stg').forEach((b,j)=>b.classList.toggle('on',j===i));const b=bar.children[i];bar.scrollTo({left:b.offsetLeft-(bar.clientWidth-b.offsetWidth)/2,behavior:'smooth'})}},80)},{passive:true});
}
function autoGrow(){const ta=document.getElementById('txt');if(!ta)return;ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px'})}

/* ---------- Hojas inferiores y avisos ---------- */
const scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet'),toastEl=document.getElementById('toast');
function openSheet(h){sheet.innerHTML='<div class="grab"></div>'+h;scrim.classList.add('open');sheet.classList.add('open')}
function closeSheet(){scrim.classList.remove('open');sheet.classList.remove('open')}
let tt;function toast(m){toastEl.innerHTML=I('check')+m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),1900)}

/* ---------- Acciones ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=+el.dataset.id;
  if(a!=='closeSheet'&&el.closest('.card')&&a==='lead'&&e.target.closest('.movebtn'))return;
  switch(a){
    case 'tab':setTab(el.dataset.tab);break;
    case 'back':back();break;
    case 'chat':go('chat',id);break;
    case 'lead':go('lead',id);break;
    case 'mod':go('mod',el.dataset.mod);break;
    case 'ifilter':S.inboxFilter=el.dataset.f;render();break;
    case 'stage':S.stage=+el.dataset.i;render();break;
    case 'day':S.day=+el.dataset.i;render();break;
    case 'chipsel':el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el));break;
    case 'task':{const t=tasks.find(t=>t.id===id);t.done=!t.done;render();if(t.done)toast('Tarea completada');break}
    case 'move':{e.stopPropagation();const l=leadBy(id);openSheet(`<h4>Mover a etapa</h4><div class="sub">${l.n}</div>${STAGES.map((s,i)=>`<button class="opt ${l.st===i?'cur':''}" data-action="setstage" data-id="${id}" data-i="${i}">${s}${l.st===i?`<span class="end">${I('check')}</span>`:''}</button>`).join('')}`);break}
    case 'setstage':{const l=leadBy(id);l.st=+el.dataset.i;closeSheet();if(!S.stack.length&&S.tab==='crm')S.stage=l.st;render();toast(`${l.n} pasó a ${STAGES[l.st]}`);break}
    case 'new':openSheet(`<h4>Crear</h4><div class="sub">¿Qué querés agregar?</div>
      <button class="opt" data-action="created" data-msg="Lead creado"><div class="ico-tile">${I('user')}</div>Nuevo lead</button>
      <button class="opt" data-action="created" data-msg="Cita agendada"><div class="ico-tile">${I('calendar')}</div>Nueva cita</button>
      <button class="opt" data-action="created" data-msg="Tarea creada"><div class="ico-tile">${I('list')}</div>Nueva tarea</button>
      <button class="opt" data-action="created" data-msg="Mensaje enviado"><div class="ico-tile">${I('msg')}</div>Enviar WhatsApp</button>`);break;
    case 'created':closeSheet();toast(el.dataset.msg);break;
    case 'closeSheet':closeSheet();break;
    case 'send':case 'quick':{const ta=document.getElementById('txt');const x=a==='quick'?el.dataset.x:ta.value.trim();if(!x)return;(chats[id]=chats[id]||[{d:'Hoy'}]).push({k:'out',x,t:'Ahora'});const c=convs.find(c=>c.lead===id);if(c){c.last='Vos: '+x;c.t='Ahora';c.mode='Humano'}render();break}
    case 'takeover':{const c=convs.find(c=>c.lead===id);if(c)c.mode='Humano';leadBy(id).ai=false;render();toast('Tomaste la conversación');break}
    case 'theme':{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'':'dark';if(S.logged&&S.tab==='mas'&&!S.stack.length)render();break}
    case 'login':S.logged=true;S.tab='dashboard';S.stack=[];render();break;
    case 'logout':S.logged=false;render();break;
    case 'toast':toast(el.dataset.msg);break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&e.target.classList.contains('card'))e.target.click();
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='txt'){e.preventDefault();document.querySelector('.sendbtn')?.click()}
});
render();
</script>
</body>
</html>
